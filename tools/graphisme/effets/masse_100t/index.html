<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=512, height=640" />
  <title>Masse de 100 tonnes</title>
  <script src="gsap.min.js"></script>
  <style>
    @font-face { font-family: "Bangers"; src: url("fontes/bangers.woff2") format("woff2"); }
    @font-face { font-family: "Dela Gothic One"; src: url("fontes/delagothic-kata.woff2") format("woff2"); }
    html, body { margin: 0; background: transparent; }
    #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    .layer { position: absolute; left: 0; top: 0; width: 512px; height: 640px; }
    #hammer-group { position: absolute; left: 66px; top: 0; width: 380px; height: 640px; }
    .cloud { position: absolute; width: 150px; height: 104px; }
    #boom-word, #katakana { position: absolute; font-weight: 400; white-space: nowrap; }
    #boom-word {
      left: 20px; top: 78px; width: 472px; text-align: center;
      font-family: "Bangers"; font-size: 92px; letter-spacing: 3px; color: #ffe01a;
      -webkit-text-stroke: 5px #111; paint-order: stroke fill;
    }
    #katakana {
      left: 300px; top: 196px; width: 200px; text-align: center;
      font-family: "Dela Gothic One"; font-size: 40px; color: #fff;
      -webkit-text-stroke: 4px #111; paint-order: stroke fill;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-width="512" data-height="640" data-duration="2">
    <div class="clip layer" id="effect-layer" data-start="0" data-duration="2" data-track-index="0">

      <svg class="layer" id="speed-lines" viewBox="0 0 512 640">
        <path d="M60 0 L72 420 M112 0 L118 300 M400 0 L394 320 M452 0 L440 430 M30 0 L40 240 M486 0 L474 260"
          stroke="#111" stroke-width="6" fill="none"/>
      </svg>

      <svg class="layer" id="burst" viewBox="0 0 512 640">
        <polygon fill="#fff" stroke="#111" stroke-width="6"
          points="256,250 300,380 420,300 366,430 506,430 380,500 480,600 340,560 256,630 180,560 30,600 134,500 6,430 146,430 92,300 212,380"/>
        <polygon fill="#ffe01a"
          points="256,340 286,430 370,390 340,470 430,480 346,520 256,590 170,520 82,480 172,470 142,390 226,430"/>
      </svg>

      <svg class="layer" id="cracks" viewBox="0 0 512 640">
        <path d="M256 604 L196 622 L150 610 L92 632 M256 604 L320 624 L372 610 L440 634 M256 604 L240 638 M256 604 L282 640"
          stroke="#111" stroke-width="7" fill="none"/>
      </svg>

      <div id="hammer-group">
        <svg width="380" height="640" viewBox="0 0 380 640" style="position:absolute;left:0;top:0">
          <polygon points="164,-300 216,-300 222,392 158,392" fill="#8a5a2b" stroke="#fff" stroke-width="10"/>
          <polygon points="164,-300 216,-300 222,392 158,392" fill="#8a5a2b" stroke="#111" stroke-width="4"/>
          <polygon points="176,-300 190,-300 190,392 172,392" fill="#b07a3d"/>
          <polygon points="10,396 370,386 378,604 2,610" fill="#fff" stroke="#fff" stroke-width="12"/>
          <polygon points="10,396 370,386 378,604 2,610" fill="#23262e" stroke="#111" stroke-width="5"/>
          <polygon points="10,396 370,386 372,420 8,430" fill="#4a505e"/>
          <polygon points="4,572 376,566 378,604 2,610" fill="#101217"/>
          <text x="190" y="548" text-anchor="middle" font-family="Bangers" font-size="148" fill="#fff"
            stroke="#111" stroke-width="3" letter-spacing="4">100 T</text>
        </svg>
      </div>

      <svg class="cloud" id="cloud-1" viewBox="0 0 150 104" style="left:-10px;top:520px">
        <polygon points="10,74 22,38 58,44 76,14 112,28 140,54 134,90 88,98 34,98" fill="#efe9d8" stroke="#111" stroke-width="5"/></svg>
      <svg class="cloud" id="cloud-2" viewBox="0 0 150 104" style="left:372px;top:520px">
        <polygon points="140,74 128,38 92,44 74,14 38,28 10,54 16,90 62,98 116,98" fill="#efe9d8" stroke="#111" stroke-width="5"/></svg>
      <svg class="cloud" id="cloud-3" viewBox="0 0 150 104" style="left:70px;top:548px">
        <polygon points="10,74 22,38 58,44 76,14 112,28 140,54 134,90 88,98 34,98" fill="#d9d0ba" stroke="#111" stroke-width="5"/></svg>
      <svg class="cloud" id="cloud-4" viewBox="0 0 150 104" style="left:292px;top:548px">
        <polygon points="140,74 128,38 92,44 74,14 38,28 10,54 16,90 62,98 116,98" fill="#d9d0ba" stroke="#111" stroke-width="5"/></svg>

      <div id="boom-word">BADABOUM !</div>
      <div id="katakana">ドカーン</div>
    </div>
  </div>
  <script>
    /* The effect runs at 12 fps: impact lands on frame 3, see IMPACT_FRAME in planche.py. */
    const IMPACT = 0.25;
    const LIFT = 1.3;
    const tl = gsap.timeline({ paused: true });

    tl.fromTo("#hammer-group", { y: -760 }, { y: 0, duration: IMPACT, ease: "power3.in" }, 0);
    tl.fromTo("#speed-lines", { opacity: 1 }, { opacity: 0, duration: 0.01 }, IMPACT);

    tl.fromTo("#burst", { opacity: 0, scale: 0.3, transformOrigin: "50% 80%" },
      { opacity: 1, scale: 1.1, duration: 0.01 }, IMPACT);
    tl.to("#burst", { scale: 0.7, duration: 0.17 }, IMPACT + 0.02);
    tl.to("#burst", { opacity: 0, duration: 0.01 }, IMPACT + 0.25);

    tl.fromTo("#hammer-group", { scaleY: 1 }, { scaleY: 0.86, transformOrigin: "50% 100%", duration: 0.04 }, IMPACT);
    tl.to("#hammer-group", { scaleY: 1.06, duration: 0.09 }, IMPACT + 0.08);
    tl.to("#hammer-group", { scaleY: 1, duration: 0.09 }, IMPACT + 0.17);
    tl.to("#hammer-group", { rotation: -2, transformOrigin: "50% 100%", duration: 0.09 }, IMPACT + 0.26);
    tl.to("#hammer-group", { rotation: 2, duration: 0.17 }, IMPACT + 0.35);
    tl.to("#hammer-group", { rotation: 0, duration: 0.09 }, IMPACT + 0.52);

    tl.fromTo("#cracks", { opacity: 0 }, { opacity: 1, duration: 0.01 }, IMPACT);
    tl.to("#cracks", { opacity: 0, duration: 0.17 }, 1.65);

    tl.fromTo("#boom-word", { opacity: 0, scale: 0.2, rotation: -14, transformOrigin: "50% 50%" },
      { opacity: 1, scale: 1.1, rotation: -6, duration: 0.09, ease: "back.out(3)" }, IMPACT);
    tl.to("#boom-word", { scale: 1, duration: 0.09 }, IMPACT + 0.1);
    tl.to("#boom-word", { opacity: 0, y: -24, duration: 0.17 }, LIFT - 0.2);
    tl.fromTo("#katakana", { opacity: 0, scale: 0.4, rotation: 10, transformOrigin: "50% 50%" },
      { opacity: 1, scale: 1, duration: 0.09 }, IMPACT + 0.09);
    tl.to("#katakana", { opacity: 0, duration: 0.09 }, LIFT - 0.2);

    const clouds = [["#cloud-1", -110], ["#cloud-2", 110], ["#cloud-3", -60], ["#cloud-4", 60]];
    clouds.forEach(([selector, travel], index) => {
      tl.fromTo(selector, { opacity: 0, x: -travel * 0.8, y: 12, scale: 0.4 },
        { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.17, ease: "power2.out" }, IMPACT);
      tl.to(selector, { x: travel * 0.3, y: -20 - index * 6, scale: 1.2, duration: 0.8, ease: "none" }, IMPACT + 0.17);
      tl.to(selector, { opacity: 0, duration: 0.17 }, IMPACT + 0.9 + index * 0.05);
    });

    tl.to("#hammer-group", { y: -900, duration: 0.42, ease: "power2.in" }, LIFT);

    window.__timelines["main"] = tl;
  </script>
</body>
</html>
