<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=512, height=732" />
  <title>Brillance dorée</title>
  <script src="gsap.min.js"></script>
  <style>
    @font-face { font-family: "Bangers"; src: url("fontes/bangers.woff2") format("woff2"); }
    html, body { margin: 0; background: transparent; }
    #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    .layer { position: absolute; left: 0; top: 0; width: 512px; height: 732px; }
    .word { position: absolute; left: 0; width: 512px; text-align: center; font-family: "Bangers"; font-weight: 400;
      letter-spacing: 3px; color: #ffe01a; -webkit-text-stroke: 5px #111; paint-order: stroke fill; white-space: nowrap; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-width="512" data-height="732" data-duration="1">
    <div class="clip layer" data-start="0" data-duration="1" data-track-index="0">
      <svg class="layer" viewBox="0 0 512 732">
        <defs>
          <clipPath id="card"><rect x="6" y="6" width="500" height="720" rx="30"/></clipPath>
          <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff6c8" stop-opacity=".62"/>
            <stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
        </defs>
        <g clip-path="url(#card)"><rect id="sweep" x="-260" y="-120" width="170" height="1000" fill="url(#shine)" transform="rotate(22 256 366)"/></g>
        <g id="sparkles"></g>
      </svg>
    </div>
  </div>
  <script>
    /* 1 s loop at 12 fps: the sweep leaves and re-enters out of sight, so the loop has no visible seam. */
    const FRAME = 1 / 12;
    const SPARKLES = [[46, 40, 0], [470, 90, 3], [30, 300, 6], [484, 420, 9], [88, 712, 4], [430, 700, 8]];
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#sweep", { x: -160 }, { x: 980, duration: 1, ease: "none" }, 0);
    SPARKLES.forEach(([x, y, firstFrame], index) => {
      const sparkle = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
      sparkle.setAttribute("points", `${x},${y - 22} ${x + 5},${y - 5} ${x + 22},${y} ${x + 5},${y + 5} ${x},${y + 22} ${x - 5},${y + 5} ${x - 22},${y} ${x - 5},${y - 5}`);
      sparkle.setAttribute("fill", "#fffbe0");
      sparkle.setAttribute("id", `sparkle-${index}`);
      document.getElementById("sparkles").appendChild(sparkle);
      tl.set(sparkle, { opacity: 0 }, 0);
      tl.set(sparkle, { opacity: 0.7, scale: 0.6, transformOrigin: "50% 50%" }, firstFrame * FRAME);
      tl.set(sparkle, { opacity: 1, scale: 1 }, (firstFrame + 1) * FRAME);
      tl.set(sparkle, { opacity: 0.5, scale: 0.6 }, (firstFrame + 2) * FRAME);
      tl.set(sparkle, { opacity: 0 }, (firstFrame + 3) * FRAME);
    });
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
