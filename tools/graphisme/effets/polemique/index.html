<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=512, height=640" />
  <title>Polémique</title>
  <script src="gsap.min.js"></script>
  <style>
    @font-face { font-family: "Bangers"; src: url("fontes/bangers.woff2") format("woff2"); }
    html, body { margin: 0; background: transparent; }
    #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    .layer { position: absolute; left: 0; top: 0; width: 512px; height: 640px; }
    .word { position: absolute; left: 0; width: 512px; text-align: center; font-family: "Bangers"; font-weight: 400;
      letter-spacing: 3px; color: #ffe01a; -webkit-text-stroke: 5px #111; paint-order: stroke fill; white-space: nowrap; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-width="512" data-height="640" data-duration="1.5">
    <div class="clip layer" data-start="0" data-duration="1.5" data-track-index="0">
      <div id="stick-group" class="layer">
        <svg class="layer" viewBox="0 0 512 640">
          <polygon points="470,-60 490,-48 300,250 280,238" fill="#a06a35" stroke="#fff" stroke-width="7"/>
          <polygon points="470,-60 490,-48 300,250 280,238" fill="none" stroke="#111" stroke-width="3"/>
          <g transform="translate(236 262) rotate(32)">
            <path d="M-92 66 Q-112 16 -66 8 Q-82 -36 -38 -44 Q-40 -90 6 -112 Q2 -74 38 -50 Q76 -30 58 6 Q106 16 88 66 Q0 92 -92 66 Z" fill="#ff7ab8" stroke="#fff" stroke-width="9"/>
            <path d="M-92 66 Q-112 16 -66 8 Q-82 -36 -38 -44 Q-40 -90 6 -112 Q2 -74 38 -50 Q76 -30 58 6 Q106 16 88 66 Q0 92 -92 66 Z" fill="none" stroke="#111" stroke-width="4"/>
            <path d="M-66 8 Q0 34 58 6 M-38 -44 Q4 -28 38 -50" fill="none" stroke="#d94b92" stroke-width="5"/>
            <circle cx="-26" cy="42" r="9" fill="#111"/><circle cx="26" cy="42" r="9" fill="#111"/>
            <path d="M-16 58 Q0 74 16 58" fill="none" stroke="#111" stroke-width="5"/>
          </g>
        </svg>
      </div>
      <svg class="layer" id="stink" viewBox="0 0 512 640">
        <path d="M70 230 q-16 -22 0 -44 q16 -22 0 -44 M120 170 q-14 -18 0 -36 q14 -18 0 -36 M40 320 q-14 -18 0 -36 q14 -18 0 -36"
          fill="none" stroke="#7ac943" stroke-width="7" stroke-linecap="round"/>
      </svg>
      <div class="word" id="poc" style="top:60px;font-size:96px;color:#ff7ab8">POC !</div>
    </div>
  </div>
  <script>
    /* 12 fps. The stick pokes the head on frame 5. */
    const IMPACT = 5 / 12;
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#stick-group", { x: 330, y: -400, rotation: 14, transformOrigin: "95% 0%" },
      { x: 110, y: -90, rotation: 6, duration: 0.25, ease: "power1.out" }, 0);
    tl.to("#stick-group", { x: 0, y: 0, rotation: 0, duration: IMPACT - 0.25, ease: "power3.in" }, 0.25);
    tl.to("#stick-group", { x: 24, y: -18, duration: 0.09 }, IMPACT + 0.01);
    tl.to("#stick-group", { x: 0, y: 0, duration: 0.09 }, IMPACT + 0.1);
    tl.to("#stick-group", { x: 26, y: -20, duration: 0.09 }, IMPACT + 0.19);
    tl.to("#stick-group", { x: 330, y: -420, rotation: 14, duration: 0.33, ease: "power2.in" }, 1.08);
    tl.fromTo("#stink", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.09 }, IMPACT);
    tl.to("#stink", { y: -26, duration: 0.58, ease: "none" }, IMPACT + 0.09);
    tl.to("#stink", { opacity: 0, duration: 0.09 }, 1.08);
    tl.fromTo("#poc", { opacity: 0, scale: 0.3, rotation: -8, transformOrigin: "50% 50%" },
      { opacity: 1, scale: 1, duration: 0.09, ease: "back.out(3)" }, IMPACT);
    tl.to("#poc", { opacity: 0, duration: 0.09 }, 1.08);
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
